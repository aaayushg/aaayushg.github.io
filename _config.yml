# Site Settings
locale: "en-US"
title: "Aayush Gupta"
name: "Aayush Gupta"
description: "Scientist II in machine learning working on generative models, diffusion for novel modalities, computational chemistry, and drug discovery."
url: "https://aaayushg.github.io"
baseurl: ""
repository: "aaayushg/aaayushg.github.io"
timezone: America/New_York

# Author
author:
  name: "Aayush Gupta, PhD"
  role: "Scientist II, Machine Learning"
  employer: "Vida Vinci Inc"
  location: "Boston, MA"
  email: "aayush.ict@gmail.com"
  github: "aaayushg"
  linkedin: "aaayushg"
  googlescholar: "https://scholar.google.com/citations?user=DwxU1sYAAAAJ&hl=en"
  publons: "https://publons.com/researcher/3417909/aayush-gupta/"
  resume: "/files/Aayush_Resume.pdf"
  portrait: "/images/portrait.jpg"

# Build Settings
encoding: "utf-8"
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true

include:
  - _pages
  - files

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - .venv
  - .ruby-version
  - vendor

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default

sass:
  sass_dir: _sass
  style: compressed

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]
  ignore:
    envs: development
