<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

{% assign page_title = page.title | default: site.title %}
{% if page.url == "/" %}
  <title>{{ site.title }} — Machine Learning Scientist and Computational Chemist</title>
{% else %}
  <title>{{ page_title }} — {{ site.title }}</title>
{% endif %}

<meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}">
<meta name="author" content="{{ site.author.name }}">
<meta name="theme-color" content="#FBFBF9">
<link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">

<meta property="og:type" content="website">
<meta property="og:title" content="{% if page.url == '/' %}{{ site.title }}{% else %}{{ page_title }} — {{ site.title }}{% endif %}">
<meta property="og:description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}">
<meta property="og:url" content="{{ page.url | replace:'index.html','' | absolute_url }}">
<meta property="og:image" content="{{ site.author.portrait | absolute_url }}">

<link rel="icon" type="image/svg+xml" href="{{ '/images/favicon.svg' | relative_url }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
