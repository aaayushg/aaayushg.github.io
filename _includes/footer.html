<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-col">
      <span class="footer-name">{{ site.author.name }}</span>
      <span class="footer-meta">{{ site.author.role }} · {{ site.author.employer }} · {{ site.author.location }}</span>
    </div>

    <ul class="footer-links" aria-label="External profiles">
      <li><a href="mailto:{{ site.author.email }}">Email</a></li>
      <li><a href="https://scholar.google.com/citations?user=DwxU1sYAAAAJ&amp;hl=en" target="_blank" rel="noopener">Scholar</a></li>
      <li><a href="https://github.com/{{ site.author.github }}" target="_blank" rel="noopener">GitHub</a></li>
      <li><a href="https://www.linkedin.com/in/{{ site.author.linkedin }}" target="_blank" rel="noopener">LinkedIn</a></li>
      <li><a href="{{ site.author.resume | relative_url }}">CV (PDF)</a></li>
    </ul>
  </div>
</footer>
