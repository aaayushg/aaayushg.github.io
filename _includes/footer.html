<footer class="site-footer">
  <div class="container">
    <div class="footer-top">
      <div>
        <p class="footer-name">{{ site.author.name }}</p>
        <p class="footer-role">Machine Learning Scientist and Computational Chemist · {{ site.author.location }}</p>
      </div>

      <a class="footer-email" href="mailto:{{ site.author.email }}">
        {{ site.author.email }}
        <span aria-hidden="true">&nearr;</span>
      </a>
    </div>

    <div class="footer-bottom">
      <p class="footer-copy">&copy; {{ site.time | date: '%Y' }} {{ site.title }}</p>

      <ul class="footer-links" aria-label="External profiles">
        <li><a href="{{ site.author.googlescholar }}" target="_blank" rel="noopener">Google Scholar</a></li>
        <li><a href="https://github.com/{{ site.author.github }}" target="_blank" rel="noopener">GitHub</a></li>
        <li><a href="https://www.linkedin.com/in/{{ site.author.linkedin }}" target="_blank" rel="noopener">LinkedIn</a></li>
        <li><a href="{{ site.author.resume | relative_url }}" target="_blank" rel="noopener">Resume (PDF)</a></li>
      </ul>
    </div>
  </div>
</footer>
