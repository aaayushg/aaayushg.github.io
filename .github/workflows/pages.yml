name: Deploy Jekyll Site

on:
  push:
    branches:
      - master
    paths-ignore:
      - README.md
      - CHANGELOG.md
      - CONTRIBUTING.md
      - LICENSE
      - .gitignore
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JEKYLL_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Cache Jekyll build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .jekyll-cache
            .sass-cache
          key: ${{ runner.os }}-jekyll-${{ hashFiles('Gemfile') }}-${{ hashFiles('_config.yml', '_config.dev.yml', '_data/**/*', '_includes/**/*', '_layouts/**/*', '_pages/**/*', '_posts/**/*', '_publications/**/*', '_sass/**/*', '_talks/**/*', 'assets/**/*') }}
          restore-keys: |
            ${{ runner.os }}-jekyll-${{ hashFiles('Gemfile') }}-

      - name: Build site
        run: bundle exec jekyll build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4