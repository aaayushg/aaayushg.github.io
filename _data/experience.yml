focus:
  - label: "Generative Models for Novel Modalities"
    summary: "Developing diffusion models and deep generative architectures for new therapeutic modalities, conditional structure generation, and de novo molecular design."
  - label: "De Novo Protein & Binder Design"
    summary: "Building structure-guided protein binder design workflows paired with uncertainty-aware scoring and multi-parameter candidate ranking."
  - label: "Molecular Representations & ADME"
    summary: "Training predictive ADME models grounded in experimental assay data and designing algorithmic library enumeration for synthesis-ready compound sets."
  - label: "Physics-Informed Simulation"
    summary: "Combining neural network potentials, high-throughput molecular dynamics, and free-energy calculations (ABFE/RBFE) with statistical learning."

