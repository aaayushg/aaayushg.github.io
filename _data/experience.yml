focus:
  - label: "3D Diffusion & Masked Generative Models"
    summary: "Training 3D diffusion models for conformer generation and sidechain-conditioned peptide backbone design, alongside masked generative models for non-intuitive SAR exploration."
  - label: "De Novo Protein & Binder Design"
    summary: "Designing de novo protein binders with Boltz and AlphaFold, identifying experimental hits for early-stage programs with uncertainty-aware ranking."
  - label: "ML-Cheminformatics & PK/ADMET"
    summary: "Curating experimental datasets and training custom ML-cheminformatics encoders from scratch for peptide physchem and PK/ADMET prediction, paired with ML error analysis and active learning."
  - label: "Physics-Informed Simulation"
    summary: "Building scalable OpenMM MD and ABFE/RBFE free-energy pipelines, high-throughput screening protocols, and graph neural network potentials."

industry:
